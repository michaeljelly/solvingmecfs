/a><path class="ln" style="stroke-dasharray:2 4" d="M52 266 Q 200 300 312 262"/><path class="ah" d="M316.0 260.0L309.2 259.0L311.5 265.2Z"/><a href="/model#step-2"><circle class="dot" cx="330.0" cy="255.0" r="10"/><text class="dn" x="330.0" y="255.0">2</text><text class="nm" x="348.0" y="260.0" text-anchor="start">Brain and autonomic control</text><text class="gl" x="348.0" y="277.0" text-anchor="start">breathing, heart rate, volume hormones</text></a><a href="/model#step-3"><circle class="dot" cx="401.5" cy="110.4" r="10"/><text class="dn" x="401.5" y="110.4">3</text><text class="nm" x="383.5" y="110.4" text-anchor="end">Low blood volume</text><text class="gl" x="383.5" y="127.4" text-anchor="end">small stroke volume, poor venous return</text></a><a href="/model#step-4"><circle class="dot" cx="562.4" cy="74.7" r="10"/><text class="dn" x="562.4" y="74.7">4</text><text class="nm" x="562.4" y="38.7" text-anchor="middle">Vessels and capillaries</text><text class="gl" x="562.4" y="54.7" text-anchor="middle">impaired dilation, fewer capillaries</text></a><a href="/model#step-5"><circle class="dotw" cx="691.2" cy="174.8" r="10"/><text class="dn dnw" x="691.2" y="174.8">5</text><text class="nm" x="709.2" y="174.8" text-anchor="start">Tissue under-perfusion</text><text class="gl" x="709.2" y="191.8" text-anchor="start">demand exceeds delivery</text></a><a href="/model#step-6"><circle class="dotw" style="stroke-dasharray:3 2.2" cx="691.2" cy="335.2" r="10"/><text class="dn dnw" x="691.2" y="335.2">6</text><text class="nm" x="709.2" y="335.2" text-anchor="start">Tissue injury and immune response</text><text class="gl" x="709.2" y="352.2" text-anchor="start">24–72 h after exertion</text></a><a href="/model#step-7"><circle class="dotw" style="stroke-dasharray:3 2.2" cx="562.4" cy="435.3" r="10"/><text class="dn dnw" x="562.4" y="435.3">7</text><text class="nm" x="562.4" y="467.3" text-anchor="middle">Sickness response</text><text class="gl" x="562.4" y="483.3" text-anchor="middle">malaise, exhaustion, pain</text></a><a href="/model#step-8"><circle class="dot" cx="401.5" cy="399.6" r="10"/><text class="dn" x="401.5" y="399.6">8</text><text class="nm" x="383.5" y="399.6" text-anchor="end">Sympathetic arousal, poor sleep</text><text class="gl" x="383.5" y="416.6" text-anchor="end">feeds back to 2</text></a><text class="anw" x="709.2" y="116.8">exertion, standing or sensory load</text><path class="lw" style="stroke-width:1.2" d="M699.2 122.8 L693.2 158.8"/><path class="aw" d="M692.6 161.8L696.8 156.4L690.3 155.3Z"/><text class="hw" x="670.0" y="327.0" text-anchor="end">post-exertional malaise</text><text class="anw" x="670.0" y="344.0" text-anchor="end">5 → 6 → 7, peaks 24–72 h</text></svg>