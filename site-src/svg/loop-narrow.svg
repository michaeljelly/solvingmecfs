<svg class="lp-narrow" viewBox="0 0 340 640" role="group" aria-labelledby="lp-narrow-t lp-narrow-d" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="lp-narrow-t">The working model of ME/CFS: a self-sustaining loop</title><desc id="lp-narrow-d">A virus such as EBV or COVID primes the immune system (link 1), which feeds brain and hormone control (2). From there a loop runs: low blood volume and a small heart (3), poorly dilating vessels and fewer capillaries (4), tissue under-supply when effort, standing or sensory load raises demand (5), damage and an immune reaction (6), the brain’s sickness response (7), and sympathetic arousal that wrecks sleep (8), which feeds back to link 2. The loop then sustains itself without the virus. Links 5, 6 and 7 form a crash, delayed 12 to 72 hours after exertion.</desc><style>
.lp-narrow{font-family:var(--f-display)}
.lp-narrow .lp-node{fill:var(--surface);stroke:var(--rule);stroke-width:1.25}
.lp-narrow .lp-node-up{fill:var(--sunk)}
.lp-narrow .lp-node-crash{stroke:var(--warm);stroke-opacity:.55}
.lp-narrow .lp-num{font-family:var(--f-mono);font-size:12.5px;font-weight:600;fill:var(--accent)}
.lp-narrow .lp-crash .lp-num{fill:var(--warm)}
.lp-narrow .lp-name{font-size:14.5px;font-weight:650;fill:var(--ink);letter-spacing:-.005em}
.lp-narrow .lp-gloss{font-size:12.5px;fill:var(--muted)}
.lp-narrow .lp-ring{fill:none;stroke:var(--muted);stroke-opacity:.55;stroke-width:1.25}
.lp-narrow .lp-head{fill:var(--muted)}
.lp-narrow .lp-arc{fill:none;stroke:var(--warm);stroke-width:2;stroke-linecap:round}
.lp-narrow .lp-head-crash{fill:var(--warm)}
.lp-narrow .lp-glow{fill:none;stroke:var(--warm);stroke-width:11;stroke-linecap:round;opacity:0}
.lp-narrow .lp-trig{fill:none;stroke:var(--muted);stroke-width:1.25;stroke-dasharray:3 3}
.lp-narrow .lp-in{fill:none;stroke:var(--ink-2);stroke-width:1.25}
.lp-narrow .lp-head-in{fill:var(--ink-2)}
.lp-narrow .lp-note{font-family:var(--f-mono);font-size:12.5px;fill:var(--muted)}
.lp-narrow .lp-tag{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;fill:var(--muted)}
.lp-narrow .lp-warm{fill:var(--warm)}
.lp-narrow .lp-crashlbl{font-size:13.5px;font-weight:650;fill:var(--warm)}
.lp-narrow .lp-ink2{fill:var(--ink-2)}
.lp-narrow .lp-dot{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;opacity:0}
.lp-narrow a{cursor:pointer;text-decoration:none}
.lp-narrow a:hover .lp-node,.lp-narrow a:focus-visible .lp-node{stroke:var(--accent);stroke-opacity:1;stroke-width:1.75}
.lp-narrow a:hover .lp-name{fill:var(--accent-2)}
.lp-narrow a:focus{outline:none}
.lp-narrow a:focus-visible .lp-node{stroke-width:2.5}
@media (prefers-reduced-motion:no-preference){
.lp-narrow .lp-dot{opacity:.9;stroke-dasharray:.01 99.99;animation:lp-narrow-run 10s linear infinite}
.lp-narrow .lp-glow{animation:lp-narrow-glow 10s linear infinite}
@keyframes lp-narrow-run{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
@keyframes lp-narrow-glow{0%,11.5%{opacity:0}14.5%,28%{opacity:.16}32%,100%{opacity:0}}
}
</style><text class="lp-tag" x="34" y="16">TRIGGER</text><text class="lp-name" x="34" y="36" style="font-size:14px">Virus</text><text class="lp-gloss" x="80" y="36">EBV, COVID, others</text><path class="lp-trig" d="M50 44V70"/><path class="lp-head" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(50 71) rotate(90)"/><text class="lp-note" x="62" y="62">starts the loop, then not needed</text><path class="lp-glow" d="M50 416V496"/><path class="lp-in" style="stroke:var(--muted)" d="M50 126V136"/><path class="lp-head" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(50 137) rotate(90)"/><path class="lp-in" style="stroke:var(--muted)" d="M50 192V202"/><path class="lp-head" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(50 203) rotate(90)"/><path class="lp-in" style="stroke:var(--muted)" d="M50 258V268"/><path class="lp-head" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(50 269) rotate(90)"/><path class="lp-in" style="stroke:var(--muted)" d="M50 324V360"/><path class="lp-head" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(50 361) rotate(90)"/><path class="lp-arc" d="M50 416V426"/><path class="lp-head-crash" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(50 427) rotate(90)"/><path class="lp-arc" d="M50 482V492"/><path class="lp-head-crash" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(50 493) rotate(90)"/><path class="lp-in" style="stroke:var(--muted)" d="M50 548V558"/><path class="lp-head" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(50 559) rotate(90)"/><path class="lp-ring" style="stroke-opacity:.8" d="M296 588H304Q314 588 314 578V176Q314 166 304 166H300"/><path class="lp-head" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(299 166) rotate(180)"/><text class="lp-tag" transform="translate(328 377) rotate(90)" text-anchor="middle">SELF-SUSTAINING LOOP</text><path class="lp-dot" pathLength="100" d="M50 166V588H304Q314 588 314 578V176Q314 166 304 166H50"/><path class="lp-arc" style="stroke-width:1.5" d="M26 368H18V544H26"/><text class="lp-crashlbl" transform="translate(11 456) rotate(-90)" text-anchor="middle">A crash · delayed 12–72 h</text><text class="lp-note lp-warm" x="262" y="352" text-anchor="end">effort, standing, sensory</text><path class="lp-arc" style="stroke-width:1.25" d="M270 338V360"/><path class="lp-head-crash" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(270 361) rotate(90)"/><a href="/model#link-1"><rect class="lp-node lp-node-up" x="34" y="74" width="262" height="52" rx="7"/><text class="lp-num" x="46" y="96">1</text><text class="lp-name" x="64" y="96">Immune priming</text><text class="lp-gloss" x="64" y="114">Infection leaves immunity primed</text></a><a href="/model#link-2"><rect class="lp-node" x="34" y="140" width="262" height="52" rx="7"/><text class="lp-num" x="46" y="162">2</text><text class="lp-name" x="64" y="162">Brain &amp; hormones</text><text class="lp-gloss" x="64" y="180">Pituitary, ADH, stress axis</text></a><a href="/model#link-3"><rect class="lp-node" x="34" y="206" width="262" height="52" rx="7"/><text class="lp-num" x="46" y="228">3</text><text class="lp-name" x="64" y="228">Low volume, small heart</text><text class="lp-gloss" x="64" y="246">Too little blood back to heart</text></a><a href="/model#link-4"><rect class="lp-node" x="34" y="272" width="262" height="52" rx="7"/><text class="lp-num" x="46" y="294">4</text><text class="lp-name" x="64" y="294">Vessels &amp; capillaries</text><text class="lp-gloss" x="64" y="312">Poor dilation, fewer capillaries</text></a><a href="/model#link-5" class="lp-crash"><rect class="lp-node lp-node-crash" x="34" y="364" width="262" height="52" rx="7"/><text class="lp-num" x="46" y="386">5</text><text class="lp-name" x="64" y="386">Tissue under-supply</text><text class="lp-gloss" x="64" y="404">Demand outruns delivery</text></a><a href="/model#link-6" class="lp-crash"><rect class="lp-node lp-node-crash" x="34" y="430" width="262" height="52" rx="7"/><text class="lp-num" x="46" y="452">6</text><text class="lp-name" x="64" y="452">Damage &amp; immune reaction</text><text class="lp-gloss" x="64" y="470">Muscle injury, immune influx</text></a><a href="/model#link-7" class="lp-crash"><rect class="lp-node lp-node-crash" x="34" y="496" width="262" height="52" rx="7"/><text class="lp-num" x="46" y="518">7</text><text class="lp-name" x="64" y="518">Sickness response</text><text class="lp-gloss" x="64" y="536">Malaise, exhaustion, pain</text></a><a href="/model#link-8"><rect class="lp-node" x="34" y="562" width="262" height="52" rx="7"/><text class="lp-num" x="46" y="584">8</text><text class="lp-name" x="64" y="584">Arousal &amp; sleep</text><text class="lp-gloss" x="64" y="602">Sympathetic drive, poor sleep</text></a></svg>
