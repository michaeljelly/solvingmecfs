<svg class="fm-n" viewBox="0 0 340 536" role="group" aria-labelledby="fm-n-t" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="fm-n-t">A working model of ME/CFS: eight abnormalities, the last feeding back to the second</title><style>
.fm-n text{font-family:var(--f-sans);fill:var(--ink)}
.fm-n .nm{font-size:14px;font-weight:600}
.fm-n .gl{font-size:12.5px;fill:var(--muted)}
.fm-n .an{font-size:12.5px;font-style:italic;fill:var(--muted)}
.fm-n .anw{font-size:12.5px;font-style:italic;fill:var(--warm)}
.fm-n .hw{font-size:13px;font-weight:600;fill:var(--warm)}
.fm-n .ln{fill:none;stroke:var(--faint);stroke-width:1.2}
.fm-n .lw{fill:none;stroke:var(--warm);stroke-width:2}
.fm-n .ah{fill:var(--faint)} .fm-n .aw{fill:var(--warm)}
.fm-n .dot{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.fm-n .dotw{fill:var(--bg);stroke:var(--warm);stroke-width:1.6}
.fm-n .dn{font-size:11px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.fm-n .dnw{fill:var(--warm)}
.fm-n a{cursor:pointer;text-decoration:none} .fm-n a text{text-decoration:none} .fm-n a:hover .nm{fill:var(--link)} .fm-n a:focus-visible .dot{stroke:var(--link);stroke-width:2.5}
</style><text class="an" x="10" y="20">viral infection (EBV, SARS-CoV-2, others)</text><path class="ln" style="stroke-dasharray:3 3" d="M30 28 V50"/><path class="ah" d="M30.0 57.0L33.3 51.0L26.7 51.0Z"/><a href="/model#step-1"><circle class="dot" cx="30.0" cy="70.0" r="10"/><text class="dn" x="30.0" y="70.0">1</text><text class="nm" x="50.0" y="70.0" text-anchor="start">Infection and immune priming</text><text class="gl" x="50.0" y="87.0" text-anchor="start">after a severe infection</text></a><path class="ln" style="stroke-dasharray:2 4" d="M30 98 V113"/><path class="ah" d="M30.0 116.0L33.3 110.0L26.7 110.0Z"/><a href="/model#step-2"><circle class="dot" cx="30.0" cy="128.0" r="10"/><text class="dn" x="30.0" y="128.0">2</text><text class="nm" x="50.0" y="128.0" text-anchor="start">Brain and autonomic control</text><text class="gl" x="50.0" y="145.0" text-anchor="start">breathing, heart rate, volume hormones</text></a><path class="ln" d="M30 156 V171"/><path class="ah" d="M30.0 174.0L33.3 168.0L26.7 168.0Z"/><a href="/model#step-3"><circle class="dot" cx="30.0" cy="186.0" r="10"/><text class="dn" x="30.0" y="186.0">3</text><text class="nm" x="50.0" y="186.0" text-anchor="start">Low blood volume</text><text class="gl" x="50.0" y="203.0" text-anchor="start">small stroke volume, poor venous return</text></a><path class="ln" style="stroke-dasharray:2 4" d="M30 214 V229"/><path class="ah" d="M30.0 232.0L33.3 226.0L26.7 226.0Z"/><a href="/model#step-4"><circle class="dot" cx="30.0" cy="244.0" r="10"/><text class="dn" x="30.0" y="244.0">4</text><text class="nm" x="50.0" y="244.0" text-anchor="start">Vessels and capillaries</text><text class="gl" x="50.0" y="261.0" text-anchor="start">impaired dilation, fewer capillaries</text></a><path class="ln" d="M30 272 V287"/><path class="ah" d="M30.0 290.0L33.3 284.0L26.7 284.0Z"/><a href="/model#step-5"><circle class="dotw" cx="30.0" cy="302.0" r="10"/><text class="dn dnw" x="30.0" y="302.0">5</text><text class="nm" x="50.0" y="302.0" text-anchor="start">Tissue under-perfusion</text><text class="gl" x="50.0" y="319.0" text-anchor="start">demand exceeds delivery</text></a><path class="lw" style="stroke-dasharray:2 4" d="M30 330 V345"/><path class="aw" d="M30.0 348.0L33.3 342.0L26.7 342.0Z"/><a href="/model#step-6"><circle class="dotw" style="stroke-dasharray:3 2.2" cx="30.0" cy="360.0" r="10"/><text class="dn dnw" x="30.0" y="360.0">6</text><text class="nm" x="50.0" y="360.0" text-anchor="start">Tissue injury and immune response</text><text class="gl" x="50.0" y="377.0" text-anchor="start">24–72 h after exertion</text></a><path class="lw" style="stroke-dasharray:2 4" d="M30 388 V403"/><path class="aw" d="M30.0 406.0L33.3 400.0L26.7 400.0Z"/><a href="/model#step-7"><circle class="dotw" style="stroke-dasharray:3 2.2" cx="30.0" cy="418.0" r="10"/><text class="dn dnw" x="30.0" y="418.0">7</text><text class="nm" x="50.0" y="418.0" text-anchor="start">Sickness response</text><text class="gl" x="50.0" y="435.0" text-anchor="start">malaise, exhaustion, pain</text></a><path class="ln" style="stroke-dasharray:2 4" d="M30 446 V461"/><path class="ah" d="M30.0 464.0L33.3 458.0L26.7 458.0Z"/><a href="/model#step-8"><circle class="dot" cx="30.0" cy="476.0" r="10"/><text class="dn" x="30.0" y="476.0">8</text><text class="nm" x="50.0" y="476.0" text-anchor="start">Sympathetic arousal, poor sleep</text><text class="gl" x="50.0" y="493.0" text-anchor="start">feeds back to 2</text></a><path class="ln" style="stroke-dasharray:2 4" d="M300 476 H318 V128 H306"/><path class="ah" d="M302.0 128.0L308.0 131.3L308.0 124.7Z"/><text class="anw" x="50" y="284">← exertion, standing or sensory load</text><path class="lw" style="stroke-width:1.5" d="M8 294 V426"/><text class="anw" x="50" y="520">5–7: post-exertional malaise</text></svg>