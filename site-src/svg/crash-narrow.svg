<svg class="cr cr-n" viewBox="0 0 360 812" role="img" aria-labelledby="crn-t crn-d" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="crn-t">Anatomy of a crash: post-exertional malaise over ten days</title>
<desc id="crn-d">Timeline from an exertion at time zero to about ten days. A healthy person dips briefly and recovers within hours to a day. In ME/CFS there is little change at first, then a delayed worsening that starts around 12 to 24 hours and peaks around 24 to 72 hours; recovery takes days to weeks and sometimes settles at a lower baseline. The 12 to 72 hour delay is something simple fuel depletion cannot explain. Research has sampled at 0 and 24 hours (two-day exercise test), at about 24 hours (muscle biopsy in long COVID, Appelman 2024) and in the recovery window (blood proteome, Germain 2025). The 48 to 72 hour peak and natural crashes are almost never sampled. Inset, the threshold falls: repeated crashes, each from a smaller trigger, with the baseline drifting down, a pattern patients describe that has not yet been measured objectively. Triggers include exercise, standing, conversation, noise and cognitive effort.</desc>
