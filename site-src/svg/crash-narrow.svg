.cr-n .cr-lab,.cr-n .cr-ll{font-size:13px}
.cr .cr-halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.cr-ax{fill:none;stroke:var(--muted);stroke-width:1}
.cr-base{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3;opacity:.8}
.cr-ex{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:1 3}
.cr-hc{fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.cr-mc{fill:none;stroke:var(--warm);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cr-lo{fill:none;stroke:var(--warm);stroke-width:1.75;stroke-dasharray:5 4;opacity:.75}
.cr-gapf{fill:var(--warm);opacity:.1}
.cr-br{fill:none;stroke:var(--warm);stroke-width:1.25}
.cr-band{fill:var(--early);opacity:.06}
.cr-hl{stroke:var(--early);stroke-width:1.3;opacity:.5}
.cr-bande{fill:none;stroke:var(--early);stroke-width:1;stroke-dasharray:3 3;opacity:.9}
.cr-lane{fill:none;stroke:var(--rule);stroke-width:1}
.cr-rng{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;opacity:.35}
.cr-dot{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.cr-panel{fill:var(--surface);stroke:var(--rule);stroke-width:1}
.cr-ibase{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.cr-ic{fill:none;stroke:var(--warm);stroke-width:2;stroke-dasharray:5 3;stroke-linecap:round}
.cr-tr{fill:var(--ink-2);opacity:.75}
.cr-key{fill:none;stroke-width:2.5}
@media (prefers-reduced-motion:no-preference){
.cr-mc{stroke-dasharray:1;animation:cr-draw 2.2s cubic-bezier(.4,0,.2,1) .3s both}
.cr-gapf,.cr-lo{animation:cr-fade .8s ease-out 1.9s backwards}
@keyframes cr-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes cr-fade{from{opacity:0}}
}
</style>
