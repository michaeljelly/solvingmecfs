<svg class="lp-wide" viewBox="0 0 960 544" role="group" aria-labelledby="lp-wide-t lp-wide-d" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="lp-wide-t">The working model of ME/CFS: a self-sustaining loop</title><desc id="lp-wide-d">A virus such as EBV or COVID primes the immune system (link 1), which feeds brain and hormone control (2). From there a loop runs: low blood volume and a small heart (3), poorly dilating vessels and fewer capillaries (4), tissue under-supply when effort, standing or sensory load raises demand (5), damage and an immune reaction (6), the brain’s sickness response (7), and sympathetic arousal that wrecks sleep (8), which feeds back to link 2. The loop then sustains itself without the virus. Links 5, 6 and 7 form a crash, delayed 12 to 72 hours after exertion.</desc><style>
.lp-wide{font-family:var(--f-display)}
.lp-wide .lp-node{fill:var(--surface);stroke:var(--rule);stroke-width:1.25}
.lp-wide .lp-node-up{fill:var(--sunk)}
.lp-wide .lp-node-crash{stroke:var(--warm);stroke-opacity:.55}
.lp-wide .lp-num{font-family:var(--f-mono);font-size:12px;font-weight:600;fill:var(--accent)}
.lp-wide .lp-crash .lp-num{fill:var(--warm)}
.lp-wide .lp-name{font-size:14px;font-weight:650;fill:var(--ink);letter-spacing:-.005em}
.lp-wide .lp-gloss{font-size:12px;fill:var(--muted)}
.lp-wide .lp-ring{fill:none;stroke:var(--muted);stroke-opacity:.55;stroke-width:1.25}
.lp-wide .lp-head{fill:var(--muted)}
.lp-wide .lp-arc{fill:none;stroke:var(--warm);stroke-width:2;stroke-linecap:round}
.lp-wide .lp-head-crash{fill:var(--warm)}
.lp-wide .lp-glow{fill:none;stroke:var(--warm);stroke-width:11;stroke-linecap:round;opacity:0}
.lp-wide .lp-trig{fill:none;stroke:var(--muted);stroke-width:1.25;stroke-dasharray:3 3}
.lp-wide .lp-in{fill:none;stroke:var(--ink-2);stroke-width:1.25}
.lp-wide .lp-head-in{fill:var(--ink-2)}
.lp-wide .lp-note{font-family:var(--f-mono);font-size:11.5px;fill:var(--muted)}
.lp-wide .lp-tag{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;fill:var(--muted)}
.lp-wide .lp-warm{fill:var(--warm)}
.lp-wide .lp-crashlbl{font-size:14px;font-weight:650;fill:var(--warm)}
.lp-wide .lp-ink2{fill:var(--ink-2)}
.lp-wide .lp-dot{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;opacity:0}
.lp-wide a{cursor:pointer;text-decoration:none}
.lp-wide a:hover .lp-node,.lp-wide a:focus-visible .lp-node{stroke:var(--accent);stroke-opacity:1;stroke-width:1.75}
.lp-wide a:hover .lp-name{fill:var(--accent-2)}
.lp-wide a:focus{outline:none}
.lp-wide a:focus-visible .lp-node{stroke-width:2.5}
@media (prefers-reduced-motion:no-preference){
.lp-wide .lp-dot{opacity:.9;stroke-dasharray:.01 99.99;animation:lp-wide-run 10s linear infinite}
.lp-wide .lp-glow{animation:lp-wide-glow 10s linear infinite}
@keyframes lp-wide-run{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
@keyframes lp-wide-glow{0%,41.1%{opacity:0}47.1%,65.7%{opacity:.16}72.7%,100%{opacity:0}}
}
</style><path class="lp-glow" d="M830.8 192.8A237 230 0 0 1 734.5 489.2"/><path class="lp-ring" d="M379 290A237 230 0 1 1 853 290A237 230 0 1 1 379 290"/><path class="lp-arc" d="M836.4 205.5A237 230 0 0 1 746.6 481.9"/><path class="lp-dot" pathLength="100" d="M379 290A237 230 0 1 1 853 290A237 230 0 1 1 379 290"/><path class="lp-head" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(402.4 190.4) rotate(-63.7)"/><path class="lp-head" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(598.5 60.6) rotate(-4.1)"/><path class="lp-head" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(796.8 141.3) rotate(48.9)"/><path class="lp-head-crash" d="M-5.2 -4.1L2.9 0L-5.2 4.1Z" transform="translate(853 290) rotate(90)"/><path class="lp-head-crash" d="M-5.2 -4.1L2.9 0L-5.2 4.1Z" transform="translate(796.8 438.7) rotate(131.1)"/><path class="lp-head" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(598.5 519.4) rotate(-175.9)"/><path class="lp-head" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(402.4 389.6) rotate(-116.3)"/><path class="lp-in" d="M238 290H267"/><path class="lp-head-in" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(268 290) rotate(0)"/><text class="lp-tag" x="22" y="110">TRIGGER</text><text class="lp-name" x="22" y="130">Virus</text><text class="lp-gloss" x="22" y="148">EBV, COVID, others</text><path class="lp-trig" d="M129 162V254"/><path class="lp-head" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(129 255) rotate(90)"/><text class="lp-note" x="139" y="202">starts the loop,</text><text class="lp-note" x="139" y="218">then not needed</text><text class="lp-note lp-warm" x="939.8" text-anchor="end" y="40">effort, standing,</text><text class="lp-note lp-warm" x="939.8" text-anchor="end" y="56">sensory load</text><path class="lp-arc" style="stroke-width:1.25" d="M896.8 66V156.8"/><path class="lp-head-crash" d="M-4.5 -3.6L2.5 0L-4.5 3.6Z" transform="translate(896.8 157.8) rotate(90)"/><a href="/model#link-1"><rect class="lp-node lp-node-up" x="20" y="258" width="218" height="64" rx="8"/><text class="lp-num" x="33" y="284">1</text><text class="lp-name" x="50" y="284">Immune priming</text><text class="lp-gloss" x="50" y="303">Infection leaves immunity primed</text></a><a href="/model#link-2"><rect class="lp-node" x="270" y="258" width="218" height="64" rx="8"/><text class="lp-num" x="283" y="284">2</text><text class="lp-name" x="300" y="284">Brain &amp; hormones</text><text class="lp-gloss" x="300" y="303">Pituitary, ADH, stress axis</text></a><a href="/model#link-3"><rect class="lp-node" x="374.5" y="67.3" width="218" height="64" rx="8"/><text class="lp-num" x="387.5" y="93.3">3</text><text class="lp-name" x="404.5" y="93.3">Low volume, small heart</text><text class="lp-gloss" x="404.5" y="112.3">Too little blood back to heart</text></a><a href="/model#link-4"><rect class="lp-node" x="625.5" y="58.8" width="218" height="64" rx="8"/><text class="lp-num" x="638.5" y="84.8">4</text><text class="lp-name" x="655.5" y="84.8">Vessels &amp; capillaries</text><text class="lp-gloss" x="655.5" y="103.8">Poor dilation, fewer capillaries</text></a><a href="/model#link-5" class="lp-crash"><rect class="lp-node lp-node-crash" x="721.8" y="160.8" width="218" height="64" rx="8"/><text class="lp-num" x="734.8" y="186.8">5</text><text class="lp-name" x="751.8" y="186.8">Tissue under-supply</text><text class="lp-gloss" x="751.8" y="205.8">Demand outruns delivery</text></a><a href="/model#link-6" class="lp-crash"><rect class="lp-node lp-node-crash" x="721.8" y="355.2" width="218" height="64" rx="8"/><text class="lp-num" x="734.8" y="381.2">6</text><text class="lp-name" x="751.8" y="381.2">Damage &amp; immune reaction</text><text class="lp-gloss" x="751.8" y="400.2">Muscle injury, immune influx</text></a><a href="/model#link-7" class="lp-crash"><rect class="lp-node lp-node-crash" x="625.5" y="457.2" width="218" height="64" rx="8"/><text class="lp-num" x="638.5" y="483.2">7</text><text class="lp-name" x="655.5" y="483.2">Sickness response</text><text class="lp-gloss" x="655.5" y="502.2">Malaise, exhaustion, pain</text></a><a href="/model#link-8"><rect class="lp-node" x="374.5" y="448.7" width="218" height="64" rx="8"/><text class="lp-num" x="387.5" y="474.7">8</text><text class="lp-name" x="404.5" y="474.7">Arousal &amp; sleep</text><text class="lp-gloss" x="404.5" y="493.7">Sympathetic drive, poor sleep</text></a><text class="lp-tag" x="566" y="276" text-anchor="middle">SELF-SUSTAINING</text><text class="lp-gloss" x="566" y="296" text-anchor="middle">8 feeds back to 2</text><text class="lp-crashlbl" x="828" y="286" text-anchor="end">A crash: 5 → 6 → 7</text><text class="lp-note lp-warm" x="828" y="304" text-anchor="end">delayed 12–72 h</text></svg>
